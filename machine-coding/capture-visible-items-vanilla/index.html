    <script>
        function isVisible(item) {
            const boundingRect = item.getBoundingClientRect();
            return (
                boundingRect.top >= 0 &&
                boundingRect.left >= 0 &&
                boundingRect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
                boundingRect.right <= (window.innerWidth || document.documentElement.clientWidth)
            )
        }

        function debouncing(func, delay) {
            let debounce;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(debounce);
                debounce = setTimeout(() => func.apply(context, args), delay);
            }
        }

        function getBlocks() {
            items.forEach(item => {
                if (isVisible(item)) {

            });
        }

        window.addEventListener('scroll', debouncing(getBlocks, 1000), false);
